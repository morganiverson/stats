<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>

            button {
                /* Disable double tap to zoom */
                touch-action: manipulation;
                color: black;
            }

            .btn-atmp3 {
                font-size: 2rem;
                font-weight: bold;
                font-family: sans-serif;
                border: 0px;
            }

            button.btn-atmp3:nth-child(odd) {
                background-color: lightgrey;
            }

            button:nth-child(n):active  {
                background-color: grey;

            }

            #error-msg {
                color: red;
                margin: 15px;
            }
            
            #btn-organizer {
                display: grid;
                grid-template-columns: auto auto auto;
                justify-self: center;
                width: 100%;
                height: 100%;
            }

            #btn-cont {
                width: 100%;
                height: 80%;
            }

            #root-cont {
                /* Contains data and buttons */
                display: flex;

                flex-direction: column;
                justify-content: space-around;
                width: 100%;
                height: 100%;
            }

            .data-cont {
                display: flex;
                justify-content: space-around;
                flex-wrap: wrap;
                flex-direction: row;
                width: 100%;
            }

            .data-holder, .data-value {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-size: 1.5rem;
                margin-bottom: 10px;
            }
            

            .data-label {
                text-decoration: underline;
            }

            #desc {
                margin: 10px;
                width: 95vw;
                text-align: center;
                display: none;;
            }

            #desc input {
                text-align: center;
                font-style: italic;
                font-family: sans-serif;
                margin-bottom: 10px;
            }

            #view-cont {
                /* Contains everything menu, and buttons */
                display: flex;
                flex-direction: column;
                align-items: center;
                height: 100dvh;
                width: 100vw;
            }

            #options {
                display: flex;
                width: 30%;
                justify-content: space-around;
            }

            #reset-btn:active {
                color: lightgray;
            }

            .counter {
                font-size: 1rem;
                font-weight: 400;
                font-style: italic;
                color: grey;
                align-self: flex-end;
                display: block;
            }

            body {
                padding: 0px;
                margin: 0px;
            }
        </style>
        <script src="component/menu.js" defer></script>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=delete,person,person_cancel,undo"/>

        <script>
            const btn_ref = "btn-atmp3";
            

            window.onload = () => {
                const err_msg_holder = document.getElementById("error-msg");
                const eff_value_holder = document.getElementById("eff-value");
                const attempt_value_holder = document.getElementById("att-value")

                const neutral_att_holder = document.getElementById("neu-count");
                const negative_att_holder = document.getElementById("neg-count");
                const positive_att_holder = document.getElementById("pos-count");

                checkIfDefined(err_msg_holder, "err_msg_holder", err_msg_holder);
                checkIfDefined(eff_value_holder, "eff_value_holder", err_msg_holder)
                checkIfDefined(attempt_value_holder, "attempt_value_holder", err_msg_holder)
                checkIfDefined(neutral_att_holder, "neutral_att_holder", err_msg_holder);
                checkIfDefined(negative_att_holder, "negative_att_holder", err_msg_holder);
                checkIfDefined(positive_att_holder, "positive_att_holder", err_msg_holder);

                var history = [];

                const btn_list = document.getElementsByClassName(btn_ref);

                checkIfDefined(btn_list, "btn_list", err_msg_holder)

                Array.from(btn_list).forEach(element => {
                    element.addEventListener("pointerdown", () => {
                        var value = parseInt(element.value);
                        history.push(value);
                        
                        update_efficiency_display(history, 
                            neutral_att_holder,
                            negative_att_holder,
                            positive_att_holder,
                            attempt_value_holder,
                            eff_value_holder);
                    });
                });
                
            
                const reset_btn = document.getElementById("reset-btn");

                if(reset_btn == undefined) {
                    err_msg_holder.innerHTML = reset_btn_error;
                    console.error(reset_btn_error)
                }
                reset_btn.addEventListener("pointerdown", () => {
                    if (history > 0) {
                        history = [];
                        update_efficiency_display(history,
                            neutral_att_holder,
                            negative_att_holder,
                            positive_att_holder,
                            attempt_value_holder,
                            eff_value_holder);
                    }
                });

                const show_desc_box = document.getElementById("show-desc");
                const desc_box = document.getElementById("desc");

                if (desc_box == undefined || show_desc_box == undefined) {
                        err_msg_holder.innerHTML = desc_btn_box_error;
                        console.error(desc_btn_box_error);
                }

                show_desc_box.addEventListener("pointerdown", (e) => {
                    if (show_desc_box.innerHTML == "person") {
                        desc_box.style.display = "block";
                        show_desc_box.innerHTML = "person_cancel";
                    } else {
                        desc_box.style.display = "none";
                        show_desc_box.innerHTML = "person";
                    }
                });

                const undo_btn = document.getElementById("undo-btn");
                checkIfDefined(undo_btn);
                undo_btn.addEventListener("pointerdown", (e) => {
                    if (history.length > 0) {
                        var last_attempt = history.pop();
                        console.log("Undoing last attempt: [" + last_attempt + "]\nAttempts: [" + history + "]");
                        update_efficiency_display(history,
                            neutral_att_holder,
                            negative_att_holder,
                            positive_att_holder,
                            attempt_value_holder,
                            eff_value_holder);
                    }
                });
            }

            const checkIfDefined = (val, name, errorDiv) => {
                if (val == undefined) {
                    errorDiv.innerHTML = "Cannot identify " + name;
                    console.error("Cannot identify " + name);
                }
            }

            const countAttempts = (history) => {
                var attempt_map = {"+1": 0, "-1": 0, "0": 0, "ttl": 0, "eff": (0).toFixed(3)};
                var sum = 0;
                if (history.length == 0) {
                    return attempt_map;
                }
                Array.from(history).forEach(attempt => {
                    attempt_map["ttl"] = attempt_map["ttl"] + 1;
                    if (attempt == 1) {
                        attempt_map["+1"] = attempt_map["+1"] + 1;
                        sum = sum + 1;
                    } else if (attempt == -1) {
                        attempt_map["-1"] = attempt_map["-1"] + 1;
                        sum = sum - 1;
                    } else {
                        attempt_map["0"] = attempt_map["0"] + 1;
                    }
                });
                attempt_map["eff"] = (sum / attempt_map["ttl"]).toFixed(3);
                return attempt_map;
            }

            const update_efficiency_display = (history, neutralDisplay, negativeDisplay, postiveDisplay, attemptDisplay, efficiencyDisplay) => {
                console.log("+1 attempt, " + history[history.length - 1] + " rating");
                

                var attempt_dist = countAttempts(history);
                var postive = attempt_dist["+1"];
                var negative = attempt_dist["-1"];
                var neutral = attempt_dist["0"];
                var efficiency = attempt_dist["eff"];
                var ttl_attempts = attempt_dist["ttl"];

                // Update Attempt Count
                neutralDisplay.innerHTML = attempt_dist["0"];
                negativeDisplay.innerHTML = attempt_dist["-1"];
                postiveDisplay.innerHTML = attempt_dist["+1"];         
                        
                //Update Display Totals
                attemptDisplay.innerHTML = attempt_dist["ttl"];
                efficiencyDisplay.innerHTML = attempt_dist["eff"];

                console.log("(eff) = " + attempt_dist["eff"]
                    + "\n(+1) = " + attempt_dist["+1"]
                    + "\n(0) = " + attempt_dist["0"]
                    +"\n(-1) = " + attempt_dist["-1"]
                    + "\n(att) = " + attempt_dist["ttl"]
                    + "\nhistory = [" + history + "]");
            }

            const display_error = (errorDisplay, errorMsg) => {
                errorDisplay.innerHTML = errorMsg;
                console.error(errorMsg);
            }
        </script>
</head>

<body>
    <div id="view-cont">
        <stats-menu dir="horizontal" current = "efficiency"></stats-menu>
    <h1>Efficiency (-1, 0, 1)</h1>
     <br>
    <div id="options">
        <div> 
            <span id="reset-btn"class="material-symbols-outlined">delete</span></div>
        <div><span id ="show-desc"class="material-symbols-outlined">person</span></div>
        <div><span id ="undo-btn" class="material-symbols-outlined">undo</span></div>

    </div>
    <div id = "desc"><hr><input id = "desc-input" type = "text" placeholder="Descriptor"/></div>
    <div id = "error-msg"></div>
    <div id = "root-cont">
        <div class="data-cont">
            <div id = "eff" class = "data-holder">
                <div class = "data-label">EFFICIENCY</div>
                <div id="eff-value" class = "data-value">0.000</div>
            </div>
            <div id = "attempts" class = "data-holder">
                <div class = "data-label">ATTEMPTS</div>
                <div id="att-value" class = "data-value">0</div>
            </div>
            </div>

        <div id = "btn-cont">
            <div id = "btn-organizer">
                <button value="-1" class = "btn-atmp3">
                    -1
                    <span id="neg-count" class="counter">0</span>
                </button>
                <button value="0" class = "btn-atmp3">
                    0
                    <span id="neu-count" class="counter">0</span>
                </button>
                <button value="+1" class = "btn-atmp3">
                    +1
                    <span id="pos-count" class="counter">0</span>
                </button>
            </div>

        </div>
    </div>
    </div>
</body>
</html>
