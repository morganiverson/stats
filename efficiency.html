<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="styles/efficiency.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=delete,person,person_cancel,undo"/>

        <script src="component/menu.js" defer></script>
        <script src="scripts/efficiency.js" type = "module"></script>
</head>

<body>
    <div id="view-cont">
        <stats-menu dir="horizontal" current = "efficiency"></stats-menu>
    <h1>Efficiency (-1, 0, 1)</h1>
     <br>
    <div id="options">
        <div> 
            <span id="reset-btn"class="material-symbols-outlined">delete</span></div>
        <div><span id ="show-desc"class="material-symbols-outlined">person</span></div>
        <div><span id ="undo-btn" class="material-symbols-outlined">undo</span></div>

    </div>
    <div id = "desc"><hr><input id = "desc-input" type = "text" placeholder="Descriptor"/></div>
    <div id = "error-msg"></div>
    <div id = "root-cont">
        <div class="data-cont">
            <div id = "eff" class = "data-holder">
                <div class = "data-label">EFFICIENCY</div>
                <div id="eff-value" class = "data-value">0.000</div>
            </div>
            <div id = "attempts" class = "data-holder">
                <div class = "data-label">ATTEMPTS</div>
                <div id="att-value" class = "data-value">0</div>
            </div>
            </div>

        <div id = "btn-cont">
            <div id = "btn-organizer">
                <button value="-1" class = "btn-atmp3">
                    -1
                    <span id="neg-count" class="counter">0</span>
                </button>
                <button value="0" class = "btn-atmp3">
                    0
                    <span id="neu-count" class="counter">0</span>
                </button>
                <button value="+1" class = "btn-atmp3">
                    +1
                    <span id="pos-count" class="counter">0</span>
                </button>
            </div>

        </div>
    </div>
    </div>
</body>
</html>
