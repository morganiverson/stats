<html>
    <head>
        <style>
            button {
                /* Disable double tap to zoom */
                touch-action: manipulation;
                color: black;
            }

            .btn-atmp4 {
                font-size: 2rem;
                font-weight: bold;
                font-family: sans-serif;
                border: 0px;
            }

            button.btn-atmp4:nth-child(3n+1) {
                background-color: lightgrey;
            }

            button:nth-child(n):active  {
                background-color: grey;

            }

            #error-msg {
                color: red;
                margin-bottom: 15px;
            }
            
            #btn-organizer {
                /* border: 1px solid black; */
                display: grid;
                grid-template-columns: auto auto;
                justify-self: center;
                width: 100%;
                height: 100%;
            }

            #btn-cont {
                width: 100%;
                height: 80%;
            }

            #root-cont {
                display: flex;
                width: 100%;
                height: 100%;

                flex-direction: column;
                justify-content: space-around;
            }

            #data-cont {
                display: flex;
                justify-content: space-around;
            }

            .data-holder, .data-value {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-size: 1.5rem;
                margin-bottom: 10px;
            }

            .data-label {
                text-decoration: underline;
            }

            #desc {
                margin: 10px;
                width: 95vw;
                text-align: center;
                display: none;;
            }

            #desc input {
                text-align: center;
                font-style: italic;
                font-family: sans-serif;
                margin-bottom: 10px;
            }

            #view-cont {
                display: flex;
                flex-direction: column;
                align-items: center;
                height: 100dvh;
                width: 100vw;
            }

            #options {
                display: flex;
                width: 30%;
                justify-content: space-around;
            }

            #reset-btn:active {
                color: lightgray;
            }

            body {
                padding: 0px;
                margin: 0px;
            
            }
        </style>
        <script src="component/menu.js" defer></script>
        
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=delete,person,person_cancel,undo"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script>
            const data_holder_error = "Cannot identify avg_value_holder and/or attempt_value_holder and/or err_msg_holder";

            const btn_list_error = "Cannot identify btn_list";
            const reset_btn_error = "Cannot identify reset_btn";
            const desc_btn_box_error = "Cannot identify desc_box and/or show_desc";
            const undo_btn_error = "Cannot identify undo_btn";

            window.onload = () => {
                const err_msg_holder = document.getElementById("error-msg");
                checkIfDefined(err_msg_holder, "err_msg_holder", err_msg_holder);

                const avg_value_holder = document.getElementById("avg-value");
                checkIfDefined(err_msg_holder, "avg_value_holder", avg_value_holder);
                
                const attempt_value_holder = document.getElementById("attempt-value");                
                checkIfDefined(attempt_value_holder, "attempt_value_holder", err_msg_holder);

                var history = [];

                const btn_list = document.getElementsByClassName("btn-atmp4");
                checkIfDefined(btn_list, "btn_list", err_msg_holder);

                Array.from(btn_list).forEach(element => {
                    element.addEventListener("pointerdown", () => {
                        var value = parseInt(element.getAttribute("value"));
                        console.log("+1 attempt\n+" + value + " rating");

                        history.push(value);
                        update_display_values(history,
                            attempt_value_holder,
                            avg_value_holder);
                    });
                });
                
                const reset_btn = document.getElementById("reset-btn");
                checkIfDefined(reset_btn, "reset_btn", err_msg_holder);

                reset_btn.addEventListener("pointerdown", () => {
                    if (history.length > 0) {
                        history = [];
                        update_display_values(history,
                            attempt_value_holder,
                            avg_value_holder);
                    }
                });

                const show_desc_box = document.getElementById("show-desc");
                const desc_box = document.getElementById("desc");

                checkIfDefined(desc_box, "desc_box", err_msg_holder);
                checkIfDefined(show_desc_box, "show_desc_box", err_msg_holder);

                show_desc_box.addEventListener("pointerdown", (e) => {
                    if(show_desc_box.innerHTML == "person") {
                        desc_box.style.display = "block";
                        show_desc_box.innerHTML = "person_cancel";
                    } else {
                        desc_box.style.display = "none";
                        show_desc_box.innerHTML = "person";
                    }
                })

                const undo_btn = document.getElementById("undo-btn");
                checkIfDefined(undo_btn, "undo_btn", err_msg_holder);

                undo_btn.addEventListener("pointerdown", (e) => {
                    if (history.length > 0) {
                        var last_attempt = history.pop();
                        console.log("Undoing last attempt: [" + last_attempt + "]\nAttempts: [" + history + "]");
                        update_display_values(history, attempt_value_holder, avg_value_holder);
                    }
                });
            }

            const display_error = (errorDisplay, errorMsg) => {
                errorDisplay.innerHTML = errorMsg;
                console.error(errorMsg);
            }

            const update_display_values = (history, attemptDisplay, averageDisplay) => {
                var att_value = history.length;
                var avg_value = calculate_avg(history);
                console.log("avg=" + avg_value + "\nattempts=" + att_value + "\nall_attempts=[" + history + "]");
                attemptDisplay.innerHTML = att_value;
                averageDisplay.innerHTML = avg_value;
            }
            
            const calculate_avg = (arr) => {
                var avg = 0;
                if (arr.length == 0) {
                    avg = 0;
                } else if (arr.length == 1) {
                    avg =  arr[0];
                } else {
                    var array = Array.from(arr);
                    var size = array.length;
                    var sum = array.reduce((a, b, i) => a + b, 0);
                    avg = sum / size;
                }
                return avg.toFixed(2);
            }

            const checkIfDefined = (val, name, errorDiv) => {
                if (val == undefined) {
                    console.error("Cannot identify " + name);
                    if (errorDiv != undefined) {
                        errorDiv.innerHTML = "Cannot identify " + name;
                    }
                }
            }
        </script>
</head>

<body>
    <div id="view-cont">
        <stats-menu 
            dir="horizontal" 
            current = "03avg">
        </stats-menu>

    <h1> 0-3 Point Averages</h1>

    <div id="options">
        <div> 
            <span id="reset-btn"class="material-symbols-outlined">delete</span></div>
        <div><span id ="show-desc"class="material-symbols-outlined">person</span></div>

        <div><span id ="undo-btn"class="material-symbols-outlined">undo</span></div>
    </div>
    <div id = "desc"><hr><input id = "desc-input" type = "text" placeholder="Descriptor"/></div>
    <div id = "error-msg"></div>
    <div id = "root-cont">
        <div id="data-cont">
        <div id = "avg" class = "data-holder">
            <div class = "data-label">AVG</div>
            <div id="avg-value" class = "data-value">0.00</div>
        </div>
        <div id = "attempt" class = "data-holder">
            <div class = "data-label">ATTEMPTS</div>
            <div id="attempt-value" class = "data-value">0</div>
        </div>

        </div>
        <div id = "btn-cont">
            <div id = "btn-organizer">
                <button value="0" class = "btn-atmp4">0</button>
                <button value="1" class = "btn-atmp4">1</button>
                <button value="2" class = "btn-atmp4">2</button>
                <button value="3" class = "btn-atmp4">3</button>
            </div>

        </div>
    </div>
    </div>
</body>
</html>
